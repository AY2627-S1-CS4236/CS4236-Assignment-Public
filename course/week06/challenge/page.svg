  <text x="73" y="559" fill="#18243a" font-family="Georgia,serif" font-size="42" font-weight="600">0</text>
  <text x="105" y="559" fill="#647086" font-family="Arial,sans-serif" font-size="18" font-weight="600">/ 30</text>
