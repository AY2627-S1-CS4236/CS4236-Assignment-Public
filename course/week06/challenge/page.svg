  <text x="984" y="299" fill="#18243a" font-family="monospace" font-size="15">game_6c7ca1834199f1dd8…</text>
  <text x="984" y="324" fill="#647086" font-family="Arial,sans-serif" font-size="12">spn-ctr-chain-hash-cmac-v1</text>

  <rect x="50" y="367" width="1180" height="88" rx="15" fill="#fff9e9" stroke="#e7d5a7"/>
  <circle cx="91" cy="411" r="21" fill="#f2dda4"/>
  <text x="91" y="420" fill="#8b5700" font-family="Arial,sans-serif" font-size="25" text-anchor="middle">≠</text>
  <text x="130" y="403" fill="#18243a" font-family="Arial,sans-serif" font-size="15" font-weight="700">The exact challenge is forbidden</text>
  <text x="130" y="429" fill="#685d43" font-family="Arial,sans-serif" font-size="16">The decryption oracle accepts any other well-formed tuple. Use permitted queries to identify the hidden choice.</text>

