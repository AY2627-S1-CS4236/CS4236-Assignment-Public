  <circle cx="99" cy="701" r="24" fill="#18243a"/>
  <text x="99" y="709" fill="#fff" font-family="Georgia,serif" font-size="22" font-weight="700" text-anchor="middle">7</text>
  <text x="142" y="682" fill="#087b68" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">CHALLENGE AUTHENTICATOR</text>
  <text x="142" y="716" fill="#18243a" font-family="Georgia,serif" font-size="25" font-weight="600">Hash the ciphertext before CMAC</text>
