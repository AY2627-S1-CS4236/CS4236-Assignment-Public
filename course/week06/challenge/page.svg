  <text x="1003" y="545" fill="#647086" font-family="Arial,sans-serif" font-size="11">Fresh key · preserve win streak</text>

  <text x="640" y="616" fill="#13705c" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Game ready. Create a challenge or inspect the encryption oracle.</text>
