  <text x="105" y="53" fill="#647086" font-family="Arial,sans-serif" font-size="12">Chosen-ciphertext experiment</text>
  <text x="1230" y="43" fill="#647086" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="end">CS4236 · WEEK 06</text>

  <text x="50" y="138" fill="#087b68" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">WEEK 06 · IND-CCA2 GAME</text>
  <text x="50" y="202" fill="#18243a" font-family="Georgia,serif" font-size="56" font-weight="600">Distinguish the hidden</text>
  <text x="50" y="263" fill="#18243a" font-family="Georgia,serif" font-size="56" font-weight="600">plaintext.</text>
  <text x="50" y="307" fill="#647086" font-family="Arial,sans-serif" font-size="17">Choose two messages, inspect the challenge tuple, and use the available oracles to decide</text>
  <text x="50" y="333" fill="#647086" font-family="Arial,sans-serif" font-size="17">which message the Server encrypted.</text>

