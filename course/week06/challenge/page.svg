<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">ETM IND-CCA2 challenge page</title>
  <desc id="description">The Week 06 challenge header, objective, game status, restriction, win streak, and hash formula.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf5f1"/>
      <stop offset="0.45" stop-color="#f5f6f3"/>
      <stop offset="1" stop-color="#f5f6f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#18243a" flood-opacity="0.09"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#paper)"/>
  <rect width="1280" height="76" fill="#fff" opacity="0.96"/>
  <path d="M0 75.5h1280" stroke="#d4d9e2"/>
  <rect x="50" y="17" width="42" height="42" rx="11" fill="#18243a"/>
  <text x="71" y="46" fill="#fff" font-family="Georgia,serif" font-size="20" font-weight="700" text-anchor="middle">A</text>
