  <text x="919" y="698" fill="#18243a" font-family="monospace" font-size="12">AD′ = AD || 80 || 00…</text>
  <text x="919" y="720" fill="#18243a" font-family="monospace" font-size="12">Hᵢ₊₁ = 7Hᵢ + Cᵢ mod 2¹²⁸</text>
