[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "educrypto"
version = "0.1.0"
description = "A student-owned educational cryptography library"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pycryptodome>=3.20"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["course"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
  "attack: public test for a student attack implementation",
]

